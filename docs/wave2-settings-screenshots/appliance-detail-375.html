<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375" />
  <title>Portal appliance detail 375</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: #0B0F1A; color: #e5e7eb; }
    .wrap { width: 375px; margin: 0 auto; padding: 12px 16px 24px; }
    .back { color: #6b7280; font-size: 14px; margin-bottom: 12px; }
    .card { background: #0D1525; border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 16px; }
    .header { display: flex; gap: 12px; align-items: flex-start; }
    .icon { width: 52px; height: 52px; border-radius: 12px; background: rgba(0,212,255,0.08); flex-shrink: 0; }
    .title { flex: 1; min-width: 0; }
    h1 { margin: 0; font-size: 1.125rem; color: #fff; text-transform: capitalize; }
    .sub { margin: 4px 0 0; font-size: 15px; color: #9ca3af; }
    .verified { color: #67e8f9; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 8px; }
    .badge { font-size: 12px; font-weight: 600; color: #22c55e; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.2); border-radius: 8px; padding: 6px 10px; }
    .edit { font-size: 12px; font-weight: 600; color: #d1d5db; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 6px 10px; }
    .grid { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tile { background: rgba(255,255,255,0.04); border-radius: 8px; padding: 8px 12px; min-height: 72px; }
    .tile label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; }
    .tile .val { font-size: 14px; color: #d1d5db; }
    .tile .mono { font-family: ui-monospace, monospace; font-weight: 600; }
    .tile .age-main { font-weight: 600; }
    .tile .age-sub { font-size: 12px; color: #9ca3af; margin-top: 2px; }
    .bar { margin-top: 8px; height: 3px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .bar > span { display: block; height: 100%; width: 28%; background: rgba(34,211,238,0.55); border-radius: 999px; }
    .tile.wide { grid-column: 1 / -1; }
    .count { color: #22d3ee; font-weight: 700; font-size: 18px; }
    .parts { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .outline { text-align: center; font-size: 13px; font-weight: 600; color: #67e8f9; border: 1px solid rgba(34,211,238,0.35); border-radius: 8px; padding: 10px 8px; text-decoration: none; }
    .schedule { display: block; margin-top: 8px; text-align: center; background: #22d3ee; color: #0a0f1a; font-weight: 700; font-size: 14px; border-radius: 8px; padding: 12px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap" id="appliance-detail-shot">
    <div class="back">← Back to My Appliances</div>
    <div class="card">
      <div class="header">
        <div class="icon"></div>
        <div class="title">
          <h1>Whirlpool Refrigerator</h1>
          <p class="sub">Model WRT311FZDW02 · <span class="verified">✓ Verified</span></p>
          <div class="actions">
            <span class="badge">Under Warranty</span>
            <span class="edit">Edit</span>
          </div>
        </div>
      </div>
      <div class="grid">
        <div class="tile"><label>Type</label><div class="val">Refrigerator</div></div>
        <div class="tile"><label>Make</label><div class="val">Whirlpool</div></div>
        <div class="tile"><label>Serial Number</label><div class="val mono">VSB3250890</div></div>
        <div class="tile">
          <label>Age</label>
          <div class="val age-main">~4 years</div>
          <div class="age-sub">Made Aug 2022</div>
          <div class="bar"><span></span></div>
        </div>
        <div class="tile"><label>Times Serviced</label><div class="val count">2</div></div>
        <div class="tile wide"><label>Service Location</label><div class="val">401 E Fremont St, Fostoria, OH</div></div>
      </div>
      <div class="parts">
        <a class="outline" href="#">Find parts</a>
        <a class="outline" href="#">Find water filter</a>
      </div>
      <a class="schedule" href="#">Schedule Service</a>
    </div>
  </div>
</body>
</html>
