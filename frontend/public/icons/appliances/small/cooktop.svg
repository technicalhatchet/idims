<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 144 144" width="48" height="48" role="img" aria-label="Cooktop repair">
  <title>Cooktop repair</title>
  <defs>
    <filter id="cooktop-sm-halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="cooktop-sm-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <g id="cooktop-sm-c" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="22" width="112" height="84" rx="10"/></g>
    <g id="cooktop-sm-o" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="38" cy="48" r="13"/><circle cx="90" cy="48" r="11"/><circle cx="38" cy="82" r="11"/><circle cx="90" cy="80" r="14"/></g>
  </defs>
  <g>
  <use href="#cooktop-sm-c" stroke="#00E5FF" stroke-width="11" opacity=".4" filter="url(#cooktop-sm-halo)"/>
  <use href="#cooktop-sm-o" stroke="#FF7A1A" stroke-width="11" opacity=".45" filter="url(#cooktop-sm-halo)"/>
  <use href="#cooktop-sm-c" stroke="#00E5FF" stroke-width="8" opacity=".9" filter="url(#cooktop-sm-glow)"/>
  <use href="#cooktop-sm-o" stroke="#FF7A1A" stroke-width="8" opacity=".9" filter="url(#cooktop-sm-glow)"/>
  <use href="#cooktop-sm-c" stroke="#00E5FF" stroke-width="5.5"/>
  <use href="#cooktop-sm-o" stroke="#FF7A1A" stroke-width="5.5"/>
  <use href="#cooktop-sm-c" stroke="#D9FDFF" stroke-width="1.8"/>
  <use href="#cooktop-sm-o" stroke="#FFE6CC" stroke-width="1.8"/>
  </g>
</svg>
