    <g id="tv-sm-c" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="16" width="116" height="78" rx="8"/><path d="M64 94 V108 M42 112 H86"/></g>
    <g id="tv-sm-o" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M72.5 41.3 A16 16 0 1 1 55.5 41.3 M64 34 V54"/></g>
