  <use href="#microwave-sm-o" stroke="#FF7A1A" stroke-width="11" opacity=".45" filter="url(#microwave-sm-halo)"/>
  <use href="#microwave-sm-c" stroke="#00E5FF" stroke-width="8" opacity=".9" filter="url(#microwave-sm-glow)"/>
  <use href="#microwave-sm-o" stroke="#FF7A1A" stroke-width="8" opacity=".9" filter="url(#microwave-sm-glow)"/>
  <use href="#microwave-sm-c" stroke="#00E5FF" stroke-width="5.5"/>
  <use href="#microwave-sm-o" stroke="#FF7A1A" stroke-width="5.5"/>
  <use href="#microwave-sm-c" stroke="#D9FDFF" stroke-width="1.8"/>
  <use href="#microwave-sm-o" stroke="#FFE6CC" stroke-width="1.8"/>
  </g>
</svg>
