    <g id="cooktop-c" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="26" width="108" height="78" rx="8"/>
    <path d="M64 44 h0.01 M64 52 h0.01 M64 60 h0.01 M64 68 h0.01"/>
    <path d="M58 92 h12"/></g>
    <g id="cooktop-o" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="52" r="14"/><g opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" dur="1.6s" begin="0s" repeatCount="indefinite"/><circle cx="36" cy="52" r="7"/></g>
    <circle cx="92" cy="48" r="10"/><g opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/><circle cx="92" cy="48" r="4.5"/></g>
    <circle cx="36" cy="86" r="9"/><g opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/><circle cx="36" cy="86" r="3.5"/></g>
    <circle cx="90" cy="82" r="13"/><g opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" dur="1.6s" begin="1.2s" repeatCount="indefinite"/><circle cx="90" cy="82" r="6.5"/></g>
    <path d="M30 18 c-3 -4 3 -6 0 -10 M40 18 c-3 -4 3 -6 0 -10"/></g>
