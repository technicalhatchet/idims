<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 96"
  fill="none"
  stroke="#00D4FF"
  stroke-width="1.5"
  stroke-linecap="round"
  stroke-linejoin="round"
  style="filter: drop-shadow(0 0 6px rgba(0, 212, 255, 0.6))">

  <!-- Cabinet -->
  <rect x="4" y="4" width="56" height="88" rx="3"/>

  <!-- Console Section -->
  <rect x="4" y="4" width="56" height="24"/>

  <!-- Detergent Drawers -->
  <rect x="8" y="8" width="12" height="7" rx="1"/>
  <rect x="8" y="15" width="12" height="7" rx="1"/>

  <!-- Vertical Lint Filter -->
  <rect x="23" y="7" width="4" height="16" rx="1"/>

  <!-- Control Knob -->
  <circle cx="36" cy="15" r="5"/>

  <!-- Display -->
  <rect x="44" y="9" width="10" height="12" rx="1"/>
  <line x1="46" y1="12" x2="52" y2="12"/>
  <line x1="46" y1="15" x2="51" y2="15"/>
  <line x1="46" y1="18" x2="50" y2="18"/>

  <!-- Console Divider -->
  <line x1="4" y1="28" x2="60" y2="28"/>

  <!-- Door -->
  <circle cx="32" cy="58" r="18"/>

  <!-- Inner Drum -->
  <circle cx="32" cy="58" r="13"/>

  <!-- Access Panel -->
  <rect x="43" y="80" width="8" height="5" rx="0.5"/>
</svg>